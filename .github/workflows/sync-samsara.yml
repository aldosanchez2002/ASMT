name: Sync Samsara to Firestore

on:
  schedule:
    # Every 30 minutes, at :07 and :37. GitHub runs schedules "best effort":
    # at busy times (especially :00 and :30) runs are delayed or skipped, so
    # off-peak minutes get through more often.
    - cron: '7,37 * * * *'
  workflow_dispatch: # lets you run it by hand from the Actions tab

concurrency:
  group: samsara-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # room for the Samsara retries (30 s, 2 min, 5 min)
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run sync
        env:
          SAMSARA_API_KEY: ${{ secrets.SAMSARA_API_KEY }}
          # Optional. Without it the sync writes through Firestore's public API,
          # which works only while the Firestore rules allow public writes.
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ALLOWED_EMAILS: ${{ secrets.ALLOWED_EMAILS }}
