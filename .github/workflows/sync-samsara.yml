name: Sync Samsara to Firestore

on:
  schedule:
    # Every 12 minutes, at :03 :15 :27 :39 :51. GitHub runs schedules "best
    # effort": at busy times (especially :00 and :30) runs are delayed or
    # skipped, so off-peak minutes get through more often. Each run only
    # writes what changed (scripts/sync-state.mjs), to stay inside
    # Firestore's free daily writes.
    - cron: '3,15,27,39,51 * * * *'
  workflow_dispatch: # lets you run it by hand from the Actions tab

concurrency:
  group: samsara-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # room for the Samsara retries (30 s, 2 min, 5 min)
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run sync
        env:
          SAMSARA_API_KEY: ${{ secrets.SAMSARA_API_KEY }}
          # Optional: a second Samsara account whose trucks and trailers are merged in.
          SAMSARA_API_KEY_2: ${{ secrets.SAMSARA_API_KEY_2 }}
          # Optional. Without it the sync writes through Firestore's public API,
          # which works only while the Firestore rules allow public writes.
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ALLOWED_EMAILS: ${{ secrets.ALLOWED_EMAILS }}
