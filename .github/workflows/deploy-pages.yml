name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/deploy-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      # GitHub Pages lets browsers cache files for hours. Stamping the commit
      # into every asset URL makes browsers fetch fresh files after a deploy.
      - name: Stamp asset URLs with the commit
        run: |
          v="${GITHUB_SHA::8}"
          sed -i -E "s#(src|href)=\"(app\.js|styles\.css)\"#\1=\"\2?v=$v\"#g" web/index.html
          sed -i -E "s#from '\./([a-z0-9-]+)\.js'#from './\1.js?v=$v'#g" web/*.js
          grep -n "?v=" web/index.html web/*.js
      # Each role's own address serves the same page (app.js picks the view
      # from the path): /admin, /parts and /receipts (inventory), /analytics.
      # Its two files load from the root.
      - name: Add the role pages
        run: |
          for page in admin parts receipts analytics; do
            mkdir -p "web/$page"
            sed -E 's#(src|href)="(app\.js|styles\.css)#\1="/\2#g' web/index.html > "web/$page/index.html"
          done
          grep -n 'app.js\|styles.css' web/admin/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
