name: Read receipts

# Reads receipt photos the buyer sent, then matches the bought parts to the
# repairs in the work log. A texted photo starts it right away (the Twilio
# Function, with its GITHUB_TOKEN); the hourly timer catches receipts uploaded
# in the app, new work to match, and anything the Function couldn't start.

on:
  schedule:
    # Hourly at :22 (GitHub runs schedules "best effort", so at busy times it
    # can be later). Quick when nothing is waiting.
    - cron: '22 * * * *'
  workflow_dispatch: # read the waiting receipts now: Twilio, or the Actions tab

# One run at a time; photos sent while it runs wait for one more run, which
# reads them all.
concurrency:
  group: read-receipts
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/read-receipts.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.AS_LOG_KEY }}
      # Then tie the bought repair parts to the repairs they were used in.
      - run: node scripts/match-items.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.AS_LOG_KEY }}
