name: Read receipts

on:
  schedule:
    # Every 30 minutes at :22 and :52 (GitHub runs schedules "best effort",
    # so at busy times it can be a few hours). Quick when nothing is waiting.
    - cron: '22,52 * * * *'
  workflow_dispatch: # read the waiting receipts now, from the Actions tab

concurrency:
  group: read-receipts
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/read-receipts.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
