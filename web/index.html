<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fleet Miles</title>
  <link rel="stylesheet" href="styles.css">
  <script>
    // Shows startup / sign-in failures on the page instead of a blank screen.
    function showAppError(msg) {
      const box = document.getElementById('app-error');
      if (!box) return;
      document.getElementById('app-error-msg').textContent = msg;
      box.hidden = false;
    }
    addEventListener('error', (e) => showAppError(e.message));
    addEventListener('unhandledrejection', (e) => showAppError(e.reason?.message ?? String(e.reason)));
  </script>
  <script type="module" src="app.js" onerror="showAppError('Could not load the app. Check your internet connection and refresh.')"></script>
</head>
<body>
  <header class="top">
    <h1>Fleet Miles</h1>
    <div id="user-box" class="user-box" hidden>
      <span id="user-email"></span>
      <button id="sign-out" class="btn btn-ghost">Sign out</button>
    </div>
  </header>

  <main>
    <section id="app-error" class="panel center error" hidden>
      <p><strong>Something went wrong.</strong></p>
      <p id="app-error-msg" class="mono"></p>
    </section>

    <section id="loading" class="panel center muted" hidden>
      <p>Loading fleet…</p>
    </section>

    <section id="signed-out" class="panel center" hidden>
      <p>Sign in to see your fleet.</p>
      <button id="sign-in" class="btn">Sign in with Google</button>
    </section>

    <section id="not-allowed" class="panel center" hidden>
      <p>This account doesn't have access. Add its email to the
        <code>ALLOWED_EMAILS</code> secret and re-run the sync.</p>
    </section>

    <section id="fleet" hidden>
      <nav class="tabs" aria-label="Views">
        <a href="#" data-tab="trucks">Trucks</a>
        <a href="#schedules" data-tab="schedules">Schedules</a>
      </nav>

      <div id="trucks-view">
      <div class="toolbar">
        <input id="search" type="search" placeholder="Search unit, model, VIN…" autocomplete="off">
        <select id="filter" aria-label="Filter trucks">
          <option value="all">All trucks</option>
          <option value="attention">Overdue or due soon</option>
        </select>
        <span id="last-sync" class="muted"></span>
      </div>

      <div id="summary" class="summary"></div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th data-sort="name">Unit</th>
              <th data-sort="year" class="hide-sm">Year</th>
              <th data-sort="make" class="hide-sm">Make</th>
              <th data-sort="model" class="hide-sm">Model</th>
              <th data-sort="odometerMiles" class="num">Miles</th>
              <th data-sort="nextRank">Next service</th>
              <th data-sort="engineHours" class="num hide-sm">Engine hrs</th>
              <th data-sort="lastReportedAt" class="hide-sm">Last reported</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <p id="empty" class="muted center" hidden></p>
      </div>

      <div id="schedules-view" hidden>
        <p id="sched-intro" class="muted"></p>
        <div id="sched-groups"></div>
      </div>
    </section>
  </main>

  <dialog id="truck" aria-labelledby="t-title">
    <div class="dlg-head">
      <div>
        <h2 id="t-title"></h2>
        <p id="t-sub" class="muted"></p>
      </div>
      <button id="t-close" class="btn btn-ghost" type="button">Close</button>
    </div>
    <div id="t-body"></div>
  </dialog>
</body>
</html>
